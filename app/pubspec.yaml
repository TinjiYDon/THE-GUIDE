name: the_guide
description: 离线占卜/心理测试 · Flutter 跨平台应用（Android+iOS）
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  sqflite: ^2.3.0
  path_provider: ^2.1.3
  shared_preferences: ^2.3.2
  in_app_purchase: ^3.2.0
  flutter_svg: ^2.0.10
  image: ^4.2.0
  share_plus: ^10.0.2
  intl: ^0.19.0
  yaml: ^3.1.2
  collection: ^1.18.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/content/
    - assets/themes/

